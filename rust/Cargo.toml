[package]
name = "dart_turso_binding"
version = "0.1.0-dev.1"
edition = "2024"
publish = false
license = "MIT"

[lib]
name = "dart_turso_binding"
crate-type = ["staticlib", "cdylib"]

[dependencies]
turso = { version = "=0.7.2", default-features = false, features = ["fts", "sync", "pure-rust-crypto"] }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
